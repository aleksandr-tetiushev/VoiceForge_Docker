services:
  voiceforge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voiceforge

    restart: unless-stopped

    environment:
      VOICE_BOT_TOKEN: "${VOICE_BOT_TOKEN}"
      SERVER_DB_NAME: "/data/discord_server.db"
      CHANNEL_DB_NAME: "/data/discord_channel.db"

    volumes:
      - voiceforge_data:/data
      - voiceforge_logs:/app/voiceforge/Logs

volumes:
  voiceforge_data:
  voiceforge_logs:
